<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Combos | Administración Smell</title><link rel="stylesheet" href="/admin/admin.css"><script type="module" src="/src/admin/combos.js"></script></head><body><div data-admin-header></div><div class="admin-loading" data-admin-loading>Verificando acceso…</div><main class="admin-main" data-admin-content hidden><h1>Combos</h1><p class="subtitle">Administra productos, precio, presentación, visibilidad e imagen de cada combo.</p><div id="combo-notice" class="notice" role="status" hidden></div>
<section class="panel" id="combo-edit-panel" hidden><h2 id="combo-edit-title">Editar combo</h2><form id="combo-form" class="edit-grid"><input type="hidden" name="id"><label>Nombre<input name="name" required maxlength="120"></label><label>Presentación<input name="type" required maxlength="180"></label><label>Precio<input name="price" type="number" min="0" step="0.01" required></label><label>Nueva imagen (máx. 3 MB)<input name="image" type="file" accept="image/png,image/jpeg,image/webp"></label><label class="wide">Productos, uno por línea<textarea name="items" rows="5" required></textarea></label><label><span>Visibilidad</span><span class="checkbox-line"><input name="active" type="checkbox" value="1"> Mostrar combo</span></label><div class="wide toolbar"><button class="btn gold" type="submit">Guardar cambios</button><button class="btn light" id="cancel-combo-edit" type="button">Cancelar</button></div></form></section>
<section class="panel"><div class="table-scroll"><table class="admin-table"><thead><tr><th>Imagen</th><th>Combo</th><th>Productos</th><th>Precio</th><th>Estado</th><th></th></tr></thead><tbody id="combo-rows"><tr><td colspan="6">Cargando combos…</td></tr></tbody></table></div></section></main></body></html>
