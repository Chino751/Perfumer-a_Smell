<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Datos del negocio | Administración Smell</title><link rel="stylesheet" href="/admin/admin.css"><script type="module" src="/src/admin/settings.js"></script></head><body><div data-admin-header></div><div class="admin-loading" data-admin-loading>Verificando acceso…</div><main class="admin-main" data-admin-content hidden><h1>Datos del negocio</h1><p class="subtitle">Estos datos aparecen en el catálogo y en los enlaces de contacto.</p><div id="settings-notice" class="notice" role="status" hidden></div><section class="panel"><form id="settings-form" class="edit-grid"><label>WhatsApp con código de país<input name="whatsapp" required maxlength="20" inputmode="numeric"></label><label>Horario<input name="hours" required maxlength="80"></label><label class="wide">Enlace de Google Maps<input type="url" name="maps_url" required maxlength="500"></label><label class="wide">Instagram<input type="url" name="instagram_url" required maxlength="500"></label><label class="wide">TikTok<input type="url" name="tiktok_url" required maxlength="500"></label><label class="wide">Texto del descuento<input name="discount_text" required maxlength="160"></label><div class="wide"><button class="btn gold" type="submit">Guardar información</button></div></form></section></main></body></html>
