<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Perfumes | Administración Smell</title><link rel="stylesheet" href="/admin/admin.css"><script type="module" src="/src/admin/perfumes.js"></script></head><body><div data-admin-header></div><div class="admin-loading" data-admin-loading>Verificando acceso…</div><main class="admin-main" data-admin-content hidden><h1>Perfumes</h1><p class="subtitle">Edita nombre, marca, stock, visibilidad e imagen. Los cuatro precios especiales permanecen bloqueados.</p><div id="perfume-notice" class="notice" role="status" hidden></div>
<section class="panel" id="perfume-edit-panel" hidden><h2 id="perfume-edit-title">Editar perfume</h2><form id="perfume-form" class="edit-grid"><input type="hidden" name="id"><label>Nombre<input name="name" required maxlength="160"></label><label>Marca<input name="brand" required maxlength="100"></label><div class="locked wide" id="protected-price" hidden></div><label>Precio 5 ml<input name="price_5" type="number" min="0" step="0.01" required></label><label>Precio 10 ml<input name="price_10" type="number" min="0" step="0.01" required></label><label>Stock 5 ml<input name="stock_5" type="number" min="0" step="1" required></label><label>Stock 10 ml<input name="stock_10" type="number" min="0" step="1" required></label><label>Stock perfume completo<input name="stock_full" type="number" min="0" step="1" required></label><label>Nueva imagen (máx. 3 MB)<input name="image" type="file" accept="image/png,image/jpeg,image/webp"></label><label><span>Visibilidad</span><span class="checkbox-line"><input name="active" type="checkbox" value="1"> Mostrar en el catálogo</span></label><div class="wide toolbar"><button class="btn gold" type="submit">Guardar cambios</button><button class="btn light" id="cancel-perfume-edit" type="button">Cancelar</button></div></form></section>
<section class="panel"><div class="toolbar"><input id="perfume-search" placeholder="Buscar perfume o marca" aria-label="Buscar perfume o marca"><button class="btn light" id="clear-perfume-search" type="button">Limpiar</button><span class="result-pill"><b id="perfume-result-count">0</b> resultados</span></div><div class="table-scroll"><table class="admin-table"><thead><tr><th>Imagen</th><th>Perfume</th><th>5 ml</th><th>10 ml</th><th>Stock</th><th>Estado</th><th></th></tr></thead><tbody id="perfume-rows"><tr><td colspan="7">Cargando perfumes…</td></tr></tbody></table></div></section></main></body></html>
